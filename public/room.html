<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房间等待 - 初创公司</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/css/style.css">
<style>
#player-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
@media (max-width: 480px) {
  #player-grid { gap: 6px; }
}
@media (max-height: 700px) {
  .room-main { padding-top: 8px !important; padding-bottom: 8px !important; gap: 8px !important; }
  .room-stack { gap: 6px !important; }
}
@keyframes pulse-ring {
  0%   { box-shadow: 0 0 0 0 rgba(74,222,128,0.5); }
  70%  { box-shadow: 0 0 0 8px rgba(74,222,128,0); }
  100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
}
.player-slot.ready-pulse { animation: pulse-ring 2s ease-out infinite; }
#connecting-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 50;
}
</style>
</head>
<body class="felt-bg flex flex-col" style="height:100dvh;overflow:hidden">

<div id="toast-container" class="toast-container"></div>

<div id="connecting-overlay">
  <span class="spinner" style="width:32px;height:32px;border-width:3px"></span>
  <p style="color:#fff;font-size:16px" id="connecting-text">连接服务器中...</p>
</div>

<header class="flex items-center justify-between px-4 py-2 sm:px-6 sm:py-3" style="background:rgba(0,0,0,0.2);">
  <a href="/" class="btn btn-sm btn-secondary" onclick="handleLeave(event)">返回首页</a>
  <span class="font-bold text-white/80 text-sm tracking-wider">初创公司</span>
  <div style="width:80px"></div>
</header>

<main class="room-main flex-1 min-h-0 overflow-hidden flex flex-col items-center justify-start py-3 gap-3">
  <!-- 房间码：紧凑横排 -->
  <div class="panel-glass px-4 py-2 w-full max-w-md flex items-center gap-3">
    <span class="text-white/50 text-xs font-medium tracking-wider uppercase flex-shrink-0">房间码</span>
    <div id="room-code-display" class="room-code-display flex-shrink-0" style="font-size:20px;letter-spacing:0.18em;line-height:1.3">------</div>
    <div class="flex gap-2 ml-auto flex-shrink-0">
      <button class="btn btn-sm btn-ghost" id="btn-copy-code" onclick="copyCode()">复制码</button>
      <button class="btn btn-sm btn-ghost" id="btn-copy-link" onclick="copyLink()">复制链接</button>
    </div>
  </div>

  <!-- 玩家列表 -->
  <div class="panel-glass p-3 w-full max-w-md flex flex-col gap-2">
    <div class="flex items-center justify-between">
      <h2 class="font-bold text-white text-sm">等待玩家加入</h2>
      <span id="player-count" class="text-white/50 text-xs">0 / 7</span>
    </div>
    <div id="player-grid"></div>
    <p class="text-center text-xs text-white/35">至少 3 人 · 最多 7 人</p>
  </div>

  <div class="room-stack flex flex-col gap-2 w-full max-w-md">
    <button id="btn-ready" class="btn btn-primary btn-lg w-full" onclick="toggleReady()" style="display:none">
      准备
    </button>
    <div id="host-area" style="display:none" class="flex flex-col gap-2">
      <div class="panel-glass px-4 py-2 flex flex-col gap-2">
        <div class="flex items-center justify-between gap-3">
          <div>
            <div class="text-white text-sm font-semibold">开局扣牌</div>
            <div id="remove-summary" class="text-xs text-white/45">扣减 5 张，剩余 40 张</div>
          </div>
          <div class="flex items-center gap-2 flex-shrink-0">
            <button class="btn btn-sm btn-secondary" onclick="adjustRemoveCount(-1)">-</button>
            <input
              id="remove-count-room"
              type="number"
              min="0"
              max="45"
              value="5"
              class="input-field"
              style="width:64px;padding:6px 8px;font-size:15px;font-weight:700;text-align:center"
              onchange="setRemoveCountFromInput()"
              oninput="setRemoveCountFromInput(true)"
            >
            <button class="btn btn-sm btn-secondary" onclick="adjustRemoveCount(1)">+</button>
          </div>
        </div>
        <div id="card-rule-hint" class="text-xs text-white/50"></div>
      </div>
      <button id="btn-start" class="btn btn-primary btn-lg w-full" onclick="startGame()" disabled>
        开始游戏
      </button>
      <p id="start-hint" class="text-center text-xs text-white/50">至少需要 3 位玩家才能开始</p>
    </div>
  </div>
</main>

<script src="/static/js/websocket.js"></script>
<script>
let roomCode = null;
let myId = null;
let myName = null;
let players = [];
let seats = [];
let isHost = false;
let isReady = false;
let removeCount = 5;
let totalCards = 45;
let requiredCards = 0;
let availableCards = 40;
let canStartByCards = true;
let removeCountTimer = null;

(function init() {
  const params = new URLSearchParams(location.search);
  const action = params.get('action');
  const code = params.get('code');
  myName = sessionStorage.getItem('player_name');

  if (!myName) {
    window.location.href = '/';
    return;
  }

  if (code) {
    roomCode = code.toUpperCase();
    document.getElementById('room-code-display').textContent = roomCode;
  }

  gameWS.on('room_created', handleRoomCreated);
  gameWS.on('room_update', handleRoomUpdate);
  gameWS.on('game_start', handleGameStart);
  gameWS.on('seat_swap_request', handleSeatSwapRequest);
  gameWS.on('seat_swap_result', handleSeatSwapResult);
  gameWS.on('error', handleError);

  setConnectingText('连接服务器中...');
  gameWS.connect();
  gameWS.on('open', () => {
    if (action === 'create') {
      setConnectingText('正在创建房间...');
      gameWS.send('create_room', { player_name: myName });
    } else if (code) {
      setConnectingText('正在加入房间...');
      gameWS.send('join_room', { room_code: code.toUpperCase(), player_name: myName });
    } else {
      window.location.href = '/';
    }
  });
})();

function handleRoomCreated(msg) {
  myId = msg.player_id;
  roomCode = msg.room_code;
  sessionStorage.setItem('room_code', roomCode);
  document.getElementById('room-code-display').textContent = roomCode;
  hideConnectingOverlay();
}

function handleRoomUpdate(msg) {
  players = msg.players || [];
  seats = msg.seats || buildSeatsFromPlayers(players);
  roomCode = msg.room_code;
  removeCount = Number.isInteger(msg.remove_count) ? msg.remove_count : removeCount;
  totalCards = Number.isInteger(msg.total_cards) ? msg.total_cards : totalCards;
  requiredCards = Number.isInteger(msg.required_cards) ? msg.required_cards : players.length * 4;
  availableCards = Number.isInteger(msg.available_cards) ? msg.available_cards : totalCards - removeCount;
  canStartByCards = msg.can_start_by_cards !== false;

  if (!myId) {
    const me = players.find((p) => p.name === myName);
    if (me) myId = me.id;
  }

  const me = players.find((p) => p.id === myId);
  isHost = me ? me.is_host : false;
  isReady = me ? me.is_ready : false;

  hideConnectingOverlay();
  renderPlayers();
  renderControls();
  renderDeckSettings();
}

function handleGameStart() {
  sessionStorage.setItem('room_code', roomCode);
  window.location.href = `/game?code=${roomCode}`;
}

function handleError(msg) {
  hideConnectingOverlay();
  showToast(msg.message || '发生错误', 'error', 5000);
}

function handleSeatSwapRequest(msg) {
  const ok = window.confirm(`${msg.requester_name || '有玩家'} 想和你交换座位，是否同意？`);
  gameWS.send('seat_swap_response', { accept: ok });
}

function handleSeatSwapResult(msg) {
  showToast(msg.message || (msg.success ? '换座请求已发送' : '对方拒绝了换座'), msg.success ? 'info' : 'error', 3000);
}

function buildSeatsFromPlayers(list) {
  const result = Array(7).fill(null);
  (list || []).forEach((p, i) => {
    const seat = Number.isInteger(p.seat_index) ? p.seat_index : i;
    if (seat >= 0 && seat < 7) result[seat] = p;
  });
  return result;
}

function renderPlayers() {
  const grid = document.getElementById('player-grid');
  grid.innerHTML = '';

  const slotCount = isHost ? 9 : 7;
  for (let i = 0; i < slotCount; i++) {
    if (i >= 7) {
      grid.appendChild(buildBotActionSlot(i));
      continue;
    }

    const p = seats[i] || null;
    const div = document.createElement('div');
    div.dataset.seatIndex = String(i);
    div.onclick = () => moveSeat(i);

    if (!p) {
      div.className = 'player-slot empty';
      div.innerHTML = `
        <div style="width:28px;height:28px;border-radius:50%;border:2px dashed rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <span style="font-size:13px;opacity:0.3">+</span>
        </div>
        <span style="font-size:10px;color:rgba(255,255,255,0.25);line-height:1.3">等待中</span>
      `;
    } else {
      const isSelf = p.id === myId;
      const colors = ['#f59e0b', '#10b981', '#3b82f6', '#a855f7', '#ef4444', '#06b6d4', '#f97316'];
      const bg = colors[i % colors.length];

      let badge = '';
      if (p.is_host) badge = `<span class="status-badge status-host">房主</span>`;
      else if (p.is_bot) badge = `<span class="status-badge status-ready">AI</span>`;
      else if (p.is_ready) badge = `<span class="status-badge status-ready">已准备</span>`;
      else badge = `<span class="status-badge status-waiting">等待中</span>`;

      div.className = 'player-slot occupied' +
        (isSelf ? ' me' : '') +
        (p.is_ready && !p.is_host && !p.is_bot ? ' ready-pulse' : '');
      div.innerHTML = `
        <div class="avatar" style="background:linear-gradient(135deg,${bg},${bg}cc)">
          ${p.is_bot ? 'AI' : avatarEmoji(p.name)}
        </div>
        <span class="text-sm font-semibold text-white truncate max-w-full px-1"
              title="${esc(p.name)}">${esc(p.name)}${isSelf ? ' (我)' : ''}</span>
        ${badge}
      `;
    }

    grid.appendChild(div);
  }

  document.getElementById('player-count').textContent = `${players.length} / 7`;
}

function buildBotActionSlot(index) {
  const div = document.createElement('div');
  div.className = 'player-slot bot-action-slot';

  const isAdd = index === 8;
  div.innerHTML = `
    <button
      id="${isAdd ? 'btn-add-bot' : 'btn-remove-bot'}"
      class="btn ${isAdd ? 'btn-primary' : 'btn-secondary'} bot-grid-btn"
      onclick="${isAdd ? 'addBot' : 'removeBot'}()"
    >
      ${isAdd ? '+ AI' : '- AI'}
    </button>
  `;
  return div;
}

function renderControls() {
  const btnReady = document.getElementById('btn-ready');
  const hostArea = document.getElementById('host-area');
  const btnStart = document.getElementById('btn-start');
  const startHint = document.getElementById('start-hint');
  const btnAddBot = document.getElementById('btn-add-bot');
  const btnRemoveBot = document.getElementById('btn-remove-bot');
  const cardRuleHint = document.getElementById('card-rule-hint');

  const bots = players.filter((p) => p.is_bot);

  if (isHost) {
    btnReady.style.display = 'none';
    hostArea.style.display = 'flex';

    const others = players.filter((p) => !p.is_host);
    const allReady = others.every((p) => p.is_bot || p.is_ready);
    const enough = players.length >= 3;

    if (btnAddBot) btnAddBot.disabled = players.length >= 7;
    if (btnRemoveBot) btnRemoveBot.disabled = bots.length === 0;

    if (!enough) {
      btnStart.disabled = true;
      startHint.textContent = `还需要 ${3 - players.length} 位玩家`;
    } else if (!allReady && others.length > 0) {
      btnStart.disabled = true;
      startHint.textContent = '等待真人玩家全部准备';
    } else if (!canStartByCards) {
      btnStart.disabled = true;
      startHint.textContent = `牌数不足：需要 ${requiredCards} 张，当前剩余 ${availableCards} 张`;
    } else {
      btnStart.disabled = false;
      startHint.textContent = `${players.length} 位玩家已满足开局条件`;
    }
    if (cardRuleHint) {
      cardRuleHint.textContent = `当前 ${players.length} 人至少需要 ${requiredCards} 张牌，扣牌后剩余 ${availableCards} / ${totalCards} 张`;
      cardRuleHint.style.color = canStartByCards ? 'rgba(255,255,255,0.5)' : '#f87171';
    }
  } else {
    btnReady.style.display = 'block';
    hostArea.style.display = 'none';
    btnReady.textContent = isReady ? '取消准备' : '准备';
    btnReady.classList.toggle('btn-primary', !isReady);
    btnReady.classList.toggle('btn-secondary', isReady);
  }
}

function moveSeat(seatIndex) {
  const me = players.find((p) => p.id === myId);
  if (!me || me.seat_index === seatIndex) return;
  gameWS.send('move_seat', { seat_index: seatIndex });
}

function renderDeckSettings() {
  const input = document.getElementById('remove-count-room');
  const summary = document.getElementById('remove-summary');
  if (input && document.activeElement !== input) input.value = String(removeCount);
  if (summary) summary.textContent = `扣减 ${removeCount} 张，剩余 ${availableCards} 张`;
}

function adjustRemoveCount(delta) {
  updateRemoveCount(removeCount + delta);
}

function setRemoveCountFromInput(debounce = false) {
  const input = document.getElementById('remove-count-room');
  if (!input) return;
  const value = parseInt(input.value, 10);
  if (Number.isNaN(value)) return;
  updateRemoveCount(value, debounce);
}

function updateRemoveCount(value, debounce = false) {
  const next = Math.max(0, Math.min(totalCards, value));
  removeCount = next;
  renderDeckSettings();
  clearTimeout(removeCountTimer);
  const send = () => gameWS.send('update_remove_count', { remove_count: next });
  if (debounce) removeCountTimer = setTimeout(send, 250);
  else send();
}

function toggleReady() {
  gameWS.send('player_ready');
}

function addBot() {
  gameWS.send('add_bot');
}

function removeBot() {
  gameWS.send('remove_bot');
}

function startGame() {
  document.getElementById('btn-start').disabled = true;
  gameWS.send('start_game');
}

function handleLeave() {
  gameWS.disconnect();
}

function copyToClipboard(text) {
  const textArea = document.createElement('textarea');
  textArea.value = text;
  textArea.style.position = 'fixed';
  textArea.style.left = '-9999px';
  textArea.style.top = '0';
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  return new Promise((resolve, reject) => {
    document.execCommand('copy') ? resolve() : reject();
    document.body.removeChild(textArea);
  });
}

function copyLink() {
  if (!roomCode) return;
  const url = `${location.origin}/?code=${roomCode}`;
  copyToClipboard(url)
    .then(() => flash('btn-copy-link', '已复制'))
    .catch(() => showToast('复制失败', 'error'));
}

function copyCode() {
  if (!roomCode) return;
  copyToClipboard(roomCode)
    .then(() => flash('btn-copy-code', '已复制'))
    .catch(() => showToast('复制失败', 'error'));
}

function flash(id, text) {
  const btn = document.getElementById(id);
  const orig = btn.textContent;
  btn.textContent = text;
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = orig;
    btn.classList.remove('copied');
  }, 2000);
}

function setConnectingText(text) {
  document.getElementById('connecting-text').textContent = text;
}

function hideConnectingOverlay() {
  const el = document.getElementById('connecting-overlay');
  if (el) el.remove();
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function avatarEmoji(name) {
  const pool = ['🐯', '🦊', '🐼', '🐧', '🦁', '🐸', '🐵', '🐨', '🐳', '🦄'];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
  return pool[h % pool.length];
}
</script>
</body>
</html>
